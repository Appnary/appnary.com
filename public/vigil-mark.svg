<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Vigil mark</title>
  <desc id="desc">Appnary-style rounded mark with a bronze shield and aqua lock.</desc>
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <!-- Shield scaled to 90%; lock stays at full size -->
  <g transform="translate(256 268) scale(0.9) translate(-256 -268)">
    <path
      fill="#B08A5A"
      d="M256 36c-78 38-160 44-226 48v168c0 116 80 204 226 258 146-54 226-142 226-258V84c-66-4-148-10-226-48z"/>
    <path
      fill="none"
      stroke="#8A6840"
      stroke-width="14"
      stroke-linejoin="round"
      d="M256 36c-78 38-160 44-226 48v168c0 116 80 204 226 258 146-54 226-142 226-258V84c-66-4-148-10-226-48z"/>
  </g>
  <!-- Aqua lock — unchanged size -->
  <path
    d="M204 250v-26c0-28 24-50 52-50s52 22 52 50v26"
    fill="none"
    stroke="#37D7C6"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <rect x="188" y="250" width="136" height="116" rx="28" fill="#37D7C6"/>
  <circle cx="256" cy="294" r="17" fill="#8A6840"/>
  <rect x="248" y="302" width="16" height="34" rx="6" fill="#8A6840"/>
  <circle cx="263" cy="288" r="7" fill="#B7F34B"/>
</svg>

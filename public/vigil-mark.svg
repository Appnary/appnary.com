<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Vigil mark</title>
  <desc id="desc">Appnary-style rounded mark with a bronze shield and bold aqua AI letters.</desc>
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <!-- Shield at 90% -->
  <g transform="translate(256 268) scale(0.9) translate(-256 -268)">
    <path
